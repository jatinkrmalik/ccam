[package]
name = "cvm"
version = "0.2.0"
edition = "2021"
description = "Account and version manager for Claude Code (like nvm, for logins and builds)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
junction = "1"
ctrlc = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
