name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          npm_version=$(grep -m1 '"version"' npm/package.json | cut -d'"' -f4)
          if [ "$version" != "$npm_version" ]; then
            echo "Cargo.toml ($version) and npm/package.json ($npm_version) must have the same version"
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Smoke test
        shell: bash
        run: |
          export CCAM_HOME="$RUNNER_TEMP/ccam-home"
          ./target/release/ccam --version
          ./target/release/ccam account add work --isolated
          ./target/release/ccam local work
          grep -q "account = work" .ccamrc
          ./target/release/ccam list
      - name: Doctor repairs PATH (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          export CCAM_HOME="$RUNNER_TEMP/doctor-home" HOME="$RUNNER_TEMP/fake-home" SHELL=/bin/bash
          mkdir -p "$HOME"
          # Claude Code is not installed on the runner, so doctor reports that and exits 1.
          ./target/release/ccam doctor --fix || true
          test -x "$CCAM_HOME/bin/ccam"
          test -e "$CCAM_HOME/bin/claude"
          grep -qs "doctor-home/bin" "$HOME/.bashrc" "$HOME/.bash_profile"
          # A second run must not add the line again.
          ./target/release/ccam doctor --fix || true
          test "$(cat "$HOME/.bashrc" "$HOME/.bash_profile" 2>/dev/null | grep -c 'doctor-home/bin')" = 1

  install:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          "$HOME/.ccam/bin/ccam" --version
          test -e "$HOME/.ccam/bin/claude"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          & "$env:USERPROFILE/.ccam/bin/ccam.exe" --version
          if (-not (Test-Path "$env:USERPROFILE/.ccam/bin/claude.exe")) { exit 1 }
      - name: npm package
        shell: bash
        run: |
          cd npm
          # The package downloads the release that matches its version. On a version
          # bump that release does not exist yet, so test against the latest one.
          latest=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/jatinkrmalik/ccam/releases/latest)
          npm pkg set version="${latest##*/v}"
          npm install -g .
          ccam --version
