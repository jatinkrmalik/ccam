[package]
name = "cvm"
version = "0.1.0"
edition = "2021"
description = "Profile and version manager for Claude Code (like nvm, for accounts)"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
junction = "1"
ctrlc = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
